<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Circuit Simulation Tool</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body, html {
    width: 100%;
    height: 100%;
    background-color: #121212;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 48px;
    background-color: #1e1e1e;
    border-bottom: 1px solid #333333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #4cacff;
  }
  .toolbar {
    display: flex;
    gap: 8px;
  }
  .btn {
    background-color: #2a2a2a;
    color: #ffffff;
    border: 1px solid #444444;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .btn:hover {
    background-color: #3a3a3a;
    border-color: #666666;
  }
  .btn.active {
    background-color: #0d6efd;
    border-color: #0a58ca;
  }
  .btn.danger {
    background-color: #dc3545;
    border-color: #b02a37;
  }
  .btn.danger:hover {
    background-color: #bb2d3b;
  }
  main {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  .panel-left {
    width: 260px;
    background-color: #1e1e1e;
    border-right: 1px solid #333333;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .panel-right {
    width: 320px;
    background-color: #1e1e1e;
    border-left: 1px solid #333333;
    display: flex;
    flex-direction: column;
    z-index: 5;
    overflow-y: auto;
  }
  .panel-section {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
  }
  .panel-title {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    color: #aaaaaa;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .comp-add-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .comp-add-btn {
    background-color: #252525;
    border: 1px dashed #555555;
    border-radius: 6px;
    padding: 10px 8px;
    text-align: center;
    cursor: grab;
    transition: all 0.2s;
    font-size: 13px;
  }
  .comp-add-btn:hover {
    background-color: #333333;
    border-color: #888888;
    transform: translateY(-1px);
  }
  .comp-add-btn:active {
    cursor: grabbing;
  }
  .comp-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .comp-list-item {
    padding: 8px 10px;
    margin-bottom: 4px;
    background-color: #252525;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    border-left: 3px solid transparent;
  }
  .comp-list-item:hover {
    background-color: #2f2f2f;
  }
  .comp-list-item.selected {
    background-color: #2b394a;
    border-left-color: #4cacff;
  }
  .comp-list-item .type-badge {
    font-size: 10px;
    padding: 2px 5px;
    background-color: #383838;
    border-radius: 3px;
    color: #cccccc;
  }
  #canvas-container {
    flex: 1;
    position: relative;
    overflow: auto;
    background-color: #000000;
  }
  #grid-canvas {
    display: block;
    background-color: #000000;
    cursor: default;
  }
  .canvas-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  #top-pane {
    background-color: #171717;
    border-bottom: 1px solid #333333;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 6;
    max-height: 40%;
    overflow-y: auto;
  }
  #error-banner {
    background-color: #dc3545;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    text-align: center;
    border: 1px solid #ff6b7a;
    display: none;
  }
  #system-summary {
    display: none;
    background-color: #14351f;
    border: 1px solid #2f8f4f;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    color: #dfffe8;
  }
  #system-summary .summary-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8fd6a4;
    margin-bottom: 6px;
    font-weight: bold;
  }
  #system-summary .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 6px 16px;
  }
  #system-summary .summary-item span.val {
    font-weight: bold;
    color: #ffffff;
  }
  .prop-group {
    margin-bottom: 14px;
  }
  .prop-label {
    font-size: 12px;
    color: #bbbbbb;
    margin-bottom: 4px;
    display: block;
  }
  .prop-input {
    width: 100%;
    padding: 8px;
    background-color: #121212;
    border: 1px solid #3d3d3d;
    border-radius: 4px;
    color: white;
    font-size: 14px;
  }
  .prop-input:focus {
    outline: none;
    border-color: #4cacff;
  }
  .prop-row {
    display: flex;
    gap: 8px;
  }
  .formula-box {
    background-color: #151515;
    border: 1px solid #2d2d2d;
    border-radius: 4px;
    padding: 8px;
    margin-top: 4px;
    font-family: monospace;
    font-size: 12px;
    color: #4cacff;
    word-break: break-all;
  }
  .formula-num {
    color: #a3d9ff;
    margin-top: 4px;
    font-size: 12px;
  }
  .branch-list {
    margin-top: 6px;
    background-color: #151515;
    border-radius: 4px;
    padding: 8px;
    max-height: 180px;
    overflow-y: auto;
  }
  .branch-item {
    font-size: 12px;
    font-family: monospace;
    padding: 4px 0;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
  }
  .branch-item:last-child {
    border-bottom: none;
  }
  .empty-state {
    color: #666;
    font-size: 13px;
    text-align: center;
    padding: 30px 10px;
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Electric Circuit Sim</h1>
  <div class="toolbar">
    <button class="btn active" id="btn-tool-select" title="Select / Move Mode (S)">👆 Select</button>
    <button class="btn" id="btn-tool-wire" title="Draw Wire Mode (W)">🔌 Draw Wire</button>
    <div style="width: 1px; background: #333; margin: 0 4px;"></div>
    <button class="btn" id="btn-rotate" title="Rotate Selected 90° (R)">🔄 Rotate</button>
    <button class="btn danger" id="btn-delete" title="Delete Selected (Del)">🗑️ Delete</button>
  </div>
</header>

<main>
  <div class="panel-left">
    <div class="panel-section">
      <div class="panel-title">Add Components</div>
      <div class="comp-add-grid">
        <div class="comp-add-btn" draggable="true" data-type="battery">🔋 Battery</div>
        <div class="comp-add-btn" draggable="true" data-type="resistor">⚡ Resistor</div>
        <div class="comp-add-btn" draggable="true" data-type="switch">🔘 Switch</div>
        <div class="comp-add-btn" draggable="true" data-type="fuse">🧯 Fuse</div>
        <div class="comp-add-btn" draggable="true" data-type="junction">🟡 Junction</div>
        <div class="comp-add-btn" id="btn-add-wire" style="grid-column: span 2; background-color: #1d3557; border-color: #457b9d;">〰️ Draw Wire Tool</div>
      </div>
    </div>
    <div class="panel-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0;">
      <div class="panel-title">Circuit Components</div>
      <div class="comp-list" id="comp-list-container">
        <!-- populated dynamically -->
      </div>
    </div>
  </div>

  <div class="canvas-column">
    <div id="top-pane">
      <div id="error-banner"></div>
      <div id="system-summary"></div>
    </div>
    <div id="canvas-container">
      <canvas id="grid-canvas" width="3000" height="3000"></canvas>
    </div>
  </div>

  <div class="panel-right" id="properties-panel">
    <div class="panel-section">
      <div class="panel-title">Properties</div>
      <div id="prop-content">
        <div class="empty-state">Select a component, wire, or junction on the grid to view its properties and simulation formulas.</div>
      </div>
    </div>
  </div>
</main>

<script>
// --- GLOBAL STATE & CONFIG ---
const GRID_SIZE = 40;
const CANVAS_WIDTH = 3000;
const CANVAS_HEIGHT = 3000;

let components = []; // { id, type, name, x, y, rotation, voltage, resistance, rating, state, current, currentFlow, voltageDrop, maxEnergyWh, soc }
// A wire is a polyline of nodes. Each node is either { x, y } (free point)
// or { compId, terminalIndex } (bound to a component connection point).
let wires = [];      // { id, name, nodes:[...], current }
let junctions = [];  // { id, name, x, y }

let selectedItems = new Set();
let toolMode = 'select';
let wireDrawing = null;   // { nodes:[...], currentX, currentY }
let selectionBox = null;
let isDragging = false;
let dragTarget = null;     // { kind:'component'|'junction'|'wireNode'|'wireMidpoint', ... }
let dragOffset = null;
let hoverTerminal = null;
let nextId = 1;
let errorMessages = [];

const canvasContainer = document.getElementById('canvas-container');
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
const errorBanner = document.getElementById('error-banner');
const systemSummary = document.getElementById('system-summary');
const propContent = document.getElementById('prop-content');
const compListContainer = document.getElementById('comp-list-container');

// Center initial scroll
canvasContainer.scrollLeft = (CANVAS_WIDTH - canvasContainer.clientWidth) / 2;
canvasContainer.scrollTop = (CANVAS_HEIGHT - canvasContainer.clientHeight) / 2;

// --- INITIAL SAMPLE CIRCUIT ---
function initSampleCircuit() {
  let cx = Math.round(CANVAS_WIDTH / 2 / GRID_SIZE) * GRID_SIZE;
  let cy = Math.round(CANVAS_HEIGHT / 2 / GRID_SIZE) * GRID_SIZE;

  let b1 = addComponent('battery', cx - 120, cy);
  b1.voltage = 12; b1.name = "Batt1"; b1.maxEnergyWh = 100; b1.soc = 100;
  let r1 = addComponent('resistor', cx, cy - 120);
  r1.resistance = 60; r1.name = "R1"; r1.rotation = 0;
  let sw1 = addComponent('switch', cx, cy + 120);
  sw1.name = "SW1"; sw1.state = 'ON';
  let f1 = addComponent('fuse', cx + 120, cy);
  f1.name = "F1"; f1.rating = 2; f1.rotation = 90;

  // Terminal-bound nodes keep wires attached when components move.
  addWireFromNodes([
    { compId: b1.id, terminalIndex: 0 },
    { x: cx - 160, y: cy },
    { x: cx - 160, y: cy - 120 },
    { compId: r1.id, terminalIndex: 0 }
  ]);
  addWireFromNodes([
    { compId: r1.id, terminalIndex: 1 },
    { x: cx + 120, y: cy - 120 },
    { compId: f1.id, terminalIndex: 0 }
  ]);
  addWireFromNodes([
    { compId: f1.id, terminalIndex: 1 },
    { x: cx + 120, y: cy + 120 },
    { compId: sw1.id, terminalIndex: 1 }
  ]);
  addWireFromNodes([
    { compId: sw1.id, terminalIndex: 0 },
    { x: cx - 120, y: cy + 120 },
    { compId: b1.id, terminalIndex: 1 }
  ]);

  runSimulation();
  render();
}

// --- HELPER FUNCTIONS ---
function snap(val) {
  return Math.round(val / GRID_SIZE) * GRID_SIZE;
}
function getKey(x, y) {
  return `${Math.round(x)},${Math.round(y)}`;
}
function getTerminals(comp) {
  let d = 40;
  let r = (comp.rotation || 0) % 360;
  if (r === 0) return [{ x: comp.x - d, y: comp.y }, { x: comp.x + d, y: comp.y }];
  if (r === 90) return [{ x: comp.x, y: comp.y - d }, { x: comp.x, y: comp.y + d }];
  if (r === 180) return [{ x: comp.x + d, y: comp.y }, { x: comp.x - d, y: comp.y }];
  if (r === 270) return [{ x: comp.x, y: comp.y + d }, { x: comp.x, y: comp.y - d }];
  return [{ x: comp.x - d, y: comp.y }, { x: comp.x + d, y: comp.y }];
}

// --- WIRE NODE HELPERS ---
// Resolve a node to a concrete {x, y} position on the grid.
function nodePos(node) {
  if (node.compId !== undefined) {
    let comp = components.find(c => c.id === node.compId);
    if (comp) {
      let terms = getTerminals(comp);
      let t = terms[node.terminalIndex] || terms[0];
      return { x: t.x, y: t.y };
    }
  }
  return { x: node.x, y: node.y };
}

function isBoundNode(node) {
  return node.compId !== undefined && components.some(c => c.id === node.compId);
}

// Resolve every node of a wire to concrete coordinates.
function wirePoints(w) {
  return w.nodes.map(nodePos);
}

// Find a component terminal near a point; returns { compId, terminalIndex } or null.
function terminalAt(x, y, tol = 6) {
  for (let c of components) {
    let terms = getTerminals(c);
    for (let i = 0; i < terms.length; i++) {
      if (Math.hypot(x - terms[i].x, y - terms[i].y) <= tol) {
        return { compId: c.id, terminalIndex: i };
      }
    }
  }
  return null;
}

// Build a node from a raw coordinate, binding to a component terminal if one is there.
function makeNode(x, y) {
  x = snap(x); y = snap(y);
  let t = terminalAt(x, y);
  if (t) return t;
  return { x, y };
}

function addComponent(type, x, y) {
  let namePrefix = { battery: 'Batt', resistor: 'R', switch: 'SW', fuse: 'F', junction: 'J' }[type] || 'C';
  let comp = {
    id: 'c_' + (nextId++),
    type: type,
    name: namePrefix + nextId,
    x: snap(x),
    y: snap(y),
    rotation: 0,
    current: 0,
    currentFlow: 0,
    voltageDrop: 0
  };
  if (type === 'battery') { comp.voltage = 10; comp.maxEnergyWh = 100; comp.soc = 100; }
  if (type === 'resistor') comp.resistance = 100;
  if (type === 'switch') comp.state = 'ON';
  if (type === 'fuse') { comp.rating = 5; comp.state = 'INTACT'; }
  
  if (type === 'junction') {
    let j = { id: 'j_' + (nextId++), name: 'J' + nextId, x: snap(x), y: snap(y) };
    junctions.push(j);
    return j;
  }
  
  components.push(comp);
  return comp;
}

// Create a wire from an explicit list of node objects.
function addWireFromNodes(nodes) {
  if (!nodes || nodes.length < 2) return null;
  let w = {
    id: 'w_' + (nextId++),
    name: 'Wire ' + nextId,
    nodes: nodes,
    current: 0
  };
  wires.push(w);
  return w;
}

// Backwards-compatible helper: create a 2-node wire from raw coordinates.
function addWire(x1, y1, x2, y2) {
  let n1 = makeNode(x1, y1);
  let n2 = makeNode(x2, y2);
  let p1 = nodePos(n1), p2 = nodePos(n2);
  if (p1.x === p2.x && p1.y === p2.y) return null;
  return addWireFromNodes([n1, n2]);
}

function distToSegment(px, py, x1, y1, x2, y2) {
  let l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

// Distance from a point to any segment of a polyline wire.
function distToWire(px, py, w) {
  let pts = wirePoints(w);
  let min = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    let d = distToSegment(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
    if (d < min) min = d;
  }
  return min;
}

// Is (px,py) a terminal (first or last resolved node) of wire w?
function isWireTerminal(px, py, w) {
  let pts = wirePoints(w);
  let a = pts[0], b = pts[pts.length - 1];
  return (Math.abs(px - a.x) < 1 && Math.abs(py - a.y) < 1) ||
         (Math.abs(px - b.x) < 1 && Math.abs(py - b.y) < 1);
}

// Locate where a point falls on a wire: returns
//   { onWire, isTerminal, segIndex } for the closest wire within tolerance.
function locateOnWire(px, py, tol = 6, excludeId = null) {
  for (let w of wires) {
    if (excludeId && w.id === excludeId) continue;
    let pts = wirePoints(w);
    for (let i = 0; i < pts.length - 1; i++) {
      let d = distToSegment(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
      if (d <= tol) {
        return { wire: w, isTerminal: isWireTerminal(px, py, w), segIndex: i };
      }
    }
  }
  return null;
}

function ensureJunctionAt(px, py) {
  if (!junctions.some(j => j.x === px && j.y === py)) {
    junctions.push({ id: 'j_' + (nextId++), name: 'J' + nextId, x: px, y: py });
  }
}

// Split a polyline wire at an interior point (creating a shared node/junction),
// so an incoming branch attaches at a real vertex.
function splitWireAtInteriorPoint(w, px, py) {
  let pts = wirePoints(w);
  // If the point already coincides with an existing (non-terminal) node, nothing to do.
  for (let i = 1; i < pts.length - 1; i++) {
    if (pts[i].x === px && pts[i].y === py) { ensureJunctionAt(px, py); return; }
  }
  for (let i = 0; i < pts.length - 1; i++) {
    let d = distToSegment(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
    if (d < 0.5) {
      w.nodes.splice(i + 1, 0, { x: px, y: py });
      ensureJunctionAt(px, py);
      return;
    }
  }
}

function findItemAt(mx, my) {
  // Check toggle buttons
  for (let c of components) {
    if (c.type === 'switch' || c.type === 'fuse') {
      let btn = getToggleButtonBox(c);
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
        return { type: 'toggle', comp: c };
      }
    }
  }
  
  // Draggable free wire nodes (not bound to a component terminal).
  for (let w of wires) {
    for (let i = 0; i < w.nodes.length; i++) {
      if (isBoundNode(w.nodes[i])) continue;
      let p = nodePos(w.nodes[i]);
      if (Math.hypot(mx - p.x, my - p.y) <= 9) {
        return { type: 'wireNode', item: w, nodeIndex: i };
      }
    }
  }

  // Draggable segment midpoints (both endpoints are free nodes).
  for (let w of wires) {
    let pts = wirePoints(w);
    for (let i = 0; i < w.nodes.length - 1; i++) {
      if (isBoundNode(w.nodes[i]) || isBoundNode(w.nodes[i + 1])) continue;
      let mxp = (pts[i].x + pts[i + 1].x) / 2;
      let myp = (pts[i].y + pts[i + 1].y) / 2;
      if (Math.hypot(mx - mxp, my - myp) <= 8) {
        return { type: 'wireMidpoint', item: w, segIndex: i };
      }
    }
  }

  for (let j of junctions) {
    if (Math.hypot(mx - j.x, my - j.y) <= 12) return { type: 'junction', item: j };
  }
  
  for (let c of components) {
    if (Math.hypot(mx - c.x, my - c.y) <= 30) return { type: 'component', item: c };
  }
  
  for (let w of wires) {
    if (distToWire(mx, my, w) <= 8) return { type: 'wire', item: w };
  }
  return null;
}

function getToggleButtonBox(comp) {
  // Top right in world coordinates relative to bounding box
  return { x: comp.x + 12, y: comp.y - 28, w: 28, h: 16 };
}

// --- SIMULATION ENGINE (MODIFIED NODAL ANALYSIS) ---
function runSimulation() {
  errorMessages = [];
  components.forEach(c => { c.current = 0; c.currentFlow = 0; c.voltageDrop = 0; });
  wires.forEach(w => w.current = 0);
  
  if (components.length === 0 && wires.length === 0) {
    updateUI();
    return;
  }
  
  let parent = new Map();
  const find = (u) => {
    if (!parent.has(u)) parent.set(u, u);
    if (parent.get(u) !== u) parent.set(u, find(parent.get(u)));
    return parent.get(u);
  };
  const union = (u, v) => {
    let pu = find(u);
    let pv = find(v);
    if (pu !== pv) parent.set(pu, pv);
  };
  
  for (let w of wires) {
    let pts = wirePoints(w);
    for (let i = 0; i < pts.length - 1; i++) {
      union(getKey(pts[i].x, pts[i].y), getKey(pts[i + 1].x, pts[i + 1].y));
    }
  }
  
  let compNodes = new Map();
  let nodeDegree = new Map();
  let hasBattery = false;
  let activeEdges = 0;
  
  for (let c of components) {
    let terms = getTerminals(c);
    let n1 = find(getKey(terms[0].x, terms[0].y));
    let n2 = find(getKey(terms[1].x, terms[1].y));
    compNodes.set(c.id, { n1, n2 });
    
    if (c.type === 'battery') hasBattery = true;
    
    if ((c.type === 'switch' && c.state === 'OFF') || (c.type === 'fuse' && c.state === 'BLOWN')) {
      continue;
    }
    
    if (n1 !== n2) {
      nodeDegree.set(n1, (nodeDegree.get(n1) || 0) + 1);
      nodeDegree.set(n2, (nodeDegree.get(n2) || 0) + 1);
      activeEdges++;
    }
  }
  
  let isClosed = true;
  if (!hasBattery || activeEdges === 0) {
    isClosed = false;
  } else {
    for (let [node, deg] of nodeDegree.entries()) {
      if (deg < 2) {
        isClosed = false;
        break;
      }
    }
  }
  
  if (!isClosed) {
    errorMessages.push("Error: The circuit is not closed.");
    updateUI();
    return;
  }
  
  let uniqueNodes = Array.from(nodeDegree.keys());
  let nodeMap = new Map();
  uniqueNodes.forEach((nodeKey, idx) => nodeMap.set(nodeKey, idx));
  
  const N = uniqueNodes.length - 1;
  let vsList = [];
  let resList = [];
  
  for (let c of components) {
    let nodes = compNodes.get(c.id);
    if (!nodeMap.has(nodes.n1) || !nodeMap.has(nodes.n2)) continue;
    let idx1 = nodeMap.get(nodes.n1);
    let idx2 = nodeMap.get(nodes.n2);
    if (idx1 === idx2) continue;
    
    if (c.type === 'battery') {
      vsList.push({ id: c.id, comp: c, n1: idx1, n2: idx2, voltage: c.voltage });
    } else if ((c.type === 'switch' && c.state === 'ON') || (c.type === 'fuse' && c.state === 'INTACT')) {
      vsList.push({ id: c.id, comp: c, n1: idx1, n2: idx2, voltage: 0 });
    } else if (c.type === 'resistor') {
      resList.push({ id: c.id, comp: c, n1: idx1, n2: idx2, resistance: c.resistance || 1e-6 });
    }
  }
  
  const M = vsList.length;
  const size = N + M;
  let A = Array(size).fill(0).map(() => Array(size).fill(0));
  let z = Array(size).fill(0);
  
  for (let r of resList) {
    let g = 1.0 / r.resistance;
    if (r.n1 > 0) A[r.n1 - 1][r.n1 - 1] += g;
    if (r.n2 > 0) A[r.n2 - 1][r.n2 - 1] += g;
    if (r.n1 > 0 && r.n2 > 0) {
      A[r.n1 - 1][r.n2 - 1] -= g;
      A[r.n2 - 1][r.n1 - 1] -= g;
    }
  }
  
  for (let i = 0; i < M; i++) {
    let vs = vsList[i];
    let vsIdx = N + i;
    if (vs.n1 > 0) {
      A[vs.n1 - 1][vsIdx] += 1;
      A[vsIdx][vs.n1 - 1] += 1;
    }
    if (vs.n2 > 0) {
      A[vs.n2 - 1][vsIdx] -= 1;
      A[vsIdx][vs.n2 - 1] -= 1;
    }
    z[vsIdx] = vs.voltage;
  }
  
  for (let i = 0; i < size; i++) {
    let maxEl = Math.abs(A[i][i]);
    let maxRow = i;
    for (let k = i + 1; k < size; k++) {
      if (Math.abs(A[k][i]) > maxEl) {
        maxEl = Math.abs(A[k][i]);
        maxRow = k;
      }
    }
    if (maxEl < 1e-12) continue;
    
    let tmp = A[maxRow]; A[maxRow] = A[i]; A[i] = tmp;
    let tmpZ = z[maxRow]; z[maxRow] = z[i]; z[i] = tmpZ;
    
    for (let k = i + 1; k < size; k++) {
      let c = -A[k][i] / A[i][i];
      for (let j = i; j < size; j++) {
        if (i === j) A[k][j] = 0;
        else A[k][j] += c * A[i][j];
      }
      z[k] += c * z[i];
    }
  }
  
  let x = Array(size).fill(0);
  for (let i = size - 1; i >= 0; i--) {
    if (Math.abs(A[i][i]) < 1e-12) continue;
    let sum = 0;
    for (let j = i + 1; j < size; j++) sum += A[i][j] * x[j];
    x[i] = (z[i] - sum) / A[i][i];
  }
  
  let nodeVoltages = new Array(uniqueNodes.length).fill(0);
  for (let i = 1; i <= N; i++) nodeVoltages[i] = x[i - 1];
  
  for (let r of resList) {
    let v1 = nodeVoltages[r.n1];
    let v2 = nodeVoltages[r.n2];
    r.comp.voltageDrop = Math.abs(v1 - v2);
    r.comp.currentFlow = (v1 - v2) / r.resistance;
    r.comp.current = Math.abs(r.comp.currentFlow);
  }
  
  for (let i = 0; i < M; i++) {
    let vs = vsList[i];
    let currentFlowVal = x[N + i];
    vs.comp.currentFlow = currentFlowVal;
    vs.comp.current = Math.abs(currentFlowVal);
    if (vs.comp.type === 'battery') vs.comp.voltageDrop = vs.voltage;
    else vs.comp.voltageDrop = 0;
  }
  
  for (let w of wires) {
    let pts = wirePoints(w);
    let k1 = find(getKey(pts[0].x, pts[0].y));
    let attached = components.find(c => {
      let terms = getTerminals(c);
      return find(getKey(terms[0].x, terms[0].y)) === k1 || find(getKey(terms[1].x, terms[1].y)) === k1;
    });
    if (attached) w.current = attached.current || 0;
  }
  
  // Save topology so the formula generator can trace the actual circuit layout.
  simTopology = {
    compNodes,        // Map: compId -> { n1, n2 } (union-find net roots)
    nodeDegree,       // Map: net root -> degree (active edges touching it)
    nodeVoltages,     // net root voltages, keyed via nodeMap
    nodeMap           // Map: net root -> index into nodeVoltages
  };

  // --- POWER (Feature 1) ---
  // Voltage change sign: sources (battery) deliver power (positive change),
  // loads (resistors, etc.) drop voltage (negative change).
  for (let c of components) {
    let signedV;
    if (c.type === 'battery') {
      signedV = c.voltageDrop;          // battery raises potential -> positive
    } else {
      signedV = -(c.voltageDrop || 0);  // load drops potential -> negative
    }
    c.signedVoltage = signedV;
    c.power = signedV * (c.current || 0);
  }

  for (let c of components) {
    if (c.type === 'fuse' && c.state === 'INTACT') {
      if (c.current > c.rating) {
        errorMessages.push(`Warning: Fuse ${c.name} will blow! (${c.current.toFixed(2)}A > ${c.rating}A)`);
      }
    }
  }
  
  updateUI();
}

let simTopology = null;

// Trace the series loop a component belongs to. Returns the ordered list of
// active components in the loop if it is a simple series loop (every net on
// the path has degree exactly 2), otherwise null.
function traceSeriesLoop(startComp) {
  if (!simTopology) return null;
  let { compNodes, nodeDegree } = simTopology;
  let active = components.filter(c =>
    !((c.type === 'switch' && c.state === 'OFF') || (c.type === 'fuse' && c.state === 'BLOWN'))
  );
  // Build net -> components incidence (only for components with distinct nets).
  let netComps = new Map();
  for (let c of active) {
    let nn = compNodes.get(c.id);
    if (!nn || nn.n1 === nn.n2) return null;
    for (let net of [nn.n1, nn.n2]) {
      if (!netComps.has(net)) netComps.set(net, []);
      netComps.get(net).push(c);
    }
  }
  // Every net in a pure series loop connects exactly two components.
  for (let [net, list] of netComps.entries()) {
    if (list.length !== 2) return null;
  }
  // Walk the loop.
  let loop = [];
  let visited = new Set();
  let current = startComp;
  let prevNet = null;
  while (current && !visited.has(current.id)) {
    visited.add(current.id);
    loop.push(current);
    let nn = compNodes.get(current.id);
    let nextNet = (nn.n1 === prevNet) ? nn.n2 : nn.n1;
    let candidates = (netComps.get(nextNet) || []).filter(c => c.id !== current.id);
    prevNet = nextNet;
    current = candidates[0];
  }
  if (loop.length !== active.length) return null;
  return loop;
}

// --- FORMULA GENERATOR ---
// Build the correct current equation from the actual circuit topology.
// For a simple series loop:  I = (ΣV_sources) / (ΣR)  using Kirchhoff's Loop Rule.
function getLoopCurrentFormula(comp) {
  let loop = traceSeriesLoop(comp);
  if (!loop) return null;

  let sources = loop.filter(c => c.type === 'battery');
  let resistors = loop.filter(c => c.type === 'resistor');
  if (sources.length === 0 || resistors.length === 0) return null;

  let vNames = sources.map(s => `${s.name}.voltage`).join(" + ");
  let vVals = sources.map(s => `${s.voltage}V`).join(" + ");
  let sumV = sources.reduce((s, c) => s + c.voltage, 0);

  let rNames = resistors.map(r => `${r.name}.resistance`).join(" + ");
  let rVals = resistors.map(r => `${r.resistance}Ω`).join(" + ");
  let sumR = resistors.reduce((s, c) => s + c.resistance, 0);

  let vLead = sources.length > 1 ? `(${vNames})` : vNames;
  let vNumLead = sources.length > 1 ? `(${vVals})` : vVals;
  let rLead = resistors.length > 1 ? `(${rNames})` : rNames;
  let rNumLead = resistors.length > 1 ? `(${rVals})` : rVals;

  let I = sumR !== 0 ? sumV / sumR : 0;
  return {
    varStr: `${vLead} / ${rLead}`,
    numStr: `${vNumLead} / ${rNumLead} = ${I.toFixed(3)}A`,
    value: I
  };
}

function getFormulas(comp) {
  let I = comp.current || 0;
  let V = comp.voltageDrop || 0;
  let loopF = getLoopCurrentFormula(comp);

  if (comp.type === 'resistor') {
    let current = loopF
      ? { var: `Loop Rule: ${loopF.varStr}`, num: `${loopF.numStr}` }
      : { var: `${comp.name}.voltageDrop / ${comp.name}.resistance`,
          num: `${V.toFixed(3)}V / ${comp.resistance}Ω = ${I.toFixed(3)}A` };
    // Voltage drop across a resistor: V = I × R (I = calculated loop current).
    return {
      current,
      voltage: {
        var: `I × ${comp.name}.resistance`,
        num: `${I.toFixed(3)}A × ${comp.resistance}Ω = ${V.toFixed(3)}V`
      }
    };
  } else if (comp.type === 'battery') {
    let current = loopF
      ? { var: `Loop Rule: ${loopF.varStr}`, num: `${loopF.numStr}` }
      : { var: `Branch Current (from nodal solution)`, num: `${I.toFixed(3)}A` };
    return {
      current,
      voltage: {
        var: `${comp.name}.voltage (source EMF)`,
        num: `${comp.voltage}V`
      }
    };
  } else {
    // Switch / fuse (ideal, zero drop when conducting).
    let current = loopF
      ? { var: `Loop Rule: ${loopF.varStr}`, num: `${loopF.numStr}` }
      : { var: `Branch Current (from nodal solution)`, num: `${I.toFixed(3)}A` };
    return {
      current,
      voltage: {
        var: `I × 0Ω (ideal conductor)`,
        num: `${I.toFixed(3)}A × 0Ω = 0.000V`
      }
    };
  }
}

// Return the two resolved endpoints (terminals) of a polyline wire.
function wireEnds(w) {
  let pts = wirePoints(w);
  return [pts[0], pts[pts.length - 1]];
}

// --- KCL BRANCH CURRENTS CALCULATION ---
function getJunctionBranchCurrents(junc) {
  let branches = [];
  let connectedWires = wires.filter(w => {
    let [a, b] = wireEnds(w);
    return (a.x === junc.x && a.y === junc.y) || (b.x === junc.x && b.y === junc.y);
  });
  
  for (let w of connectedWires) {
    let [a, b] = wireEnds(w);
    let startP = (a.x === junc.x && a.y === junc.y) ? b : a;
    let visitedPts = new Set();
    let queue = [ `${startP.x},${startP.y}` ];
    visitedPts.add(`${junc.x},${junc.y}`);
    visitedPts.add(`${startP.x},${startP.y}`);
    
    while (queue.length > 0) {
      let currKey = queue.shift();
      let [cx, cy] = currKey.split(',').map(Number);
      
      for (let ow of wires) {
        if (ow.id === w.id) continue;
        let [oa, ob] = wireEnds(ow);
        let nextP = null;
        if (oa.x === cx && oa.y === cy) nextP = `${ob.x},${ob.y}`;
        else if (ob.x === cx && ob.y === cy) nextP = `${oa.x},${oa.y}`;
        
        if (nextP && !visitedPts.has(nextP)) {
          visitedPts.add(nextP);
          queue.push(nextP);
        }
      }
    }
    
    let branchCurrent = 0;
    let attachedCompNames = [];
    
    for (let c of components) {
      if ((c.type === 'switch' && c.state === 'OFF') || (c.type === 'fuse' && c.state === 'BLOWN')) continue;
      let terms = getTerminals(c);
      let k0 = `${terms[0].x},${terms[0].y}`;
      let k1 = `${terms[1].x},${terms[1].y}`;
      
      if (visitedPts.has(k0)) {
        branchCurrent += -c.currentFlow;
        attachedCompNames.push(c.name);
      }
      if (visitedPts.has(k1)) {
        branchCurrent += c.currentFlow;
        attachedCompNames.push(c.name);
      }
    }
    
    let label = attachedCompNames.length > 0 ? `${w.name} → ${Array.from(new Set(attachedCompNames)).join(', ')}` : w.name;
    branches.push({ name: label, current: branchCurrent });
  }
  return branches;
}

// --- RENDER & UI UPDATE ---
function render() {
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  
  // Grid
  ctx.strokeStyle = '#222222';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= CANVAS_WIDTH; x += GRID_SIZE) {
    ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_HEIGHT);
  }
  for (let y = 0; y <= CANVAS_HEIGHT; y += GRID_SIZE) {
    ctx.moveTo(0, y); ctx.lineTo(CANVAS_WIDTH, y);
  }
  ctx.stroke();
  
  // Wires (polylines)
  wires.forEach(w => {
    let pts = wirePoints(w);
    let isSelected = selectedItems.has(w.id);
    ctx.strokeStyle = isSelected ? '#4cacff' : '#ff3333';
    ctx.lineWidth = isSelected ? 4 : 3;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    if (isSelected) {
      // Draggable free-node handles.
      for (let i = 0; i < w.nodes.length; i++) {
        if (isBoundNode(w.nodes[i])) continue;
        let p = pts[i];
        ctx.fillStyle = '#4cacff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      // Draggable segment midpoints (both endpoints free).
      for (let i = 0; i < w.nodes.length - 1; i++) {
        if (isBoundNode(w.nodes[i]) || isBoundNode(w.nodes[i + 1])) continue;
        let mxp = (pts[i].x + pts[i + 1].x) / 2;
        let myp = (pts[i].y + pts[i + 1].y) / 2;
        ctx.strokeStyle = '#4cacff';
        ctx.fillStyle = '#1e1e1e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(mxp, myp, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }
  });
  
  if (wireDrawing) {
    ctx.strokeStyle = '#ff8888';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    let dp = wireDrawing.nodes.map(nodePos);
    ctx.moveTo(dp[0].x, dp[0].y);
    for (let i = 1; i < dp.length; i++) ctx.lineTo(dp[i].x, dp[i].y);
    ctx.lineTo(snap(wireDrawing.currentX), snap(wireDrawing.currentY));
    ctx.stroke();
    ctx.setLineDash([]);
    // Show committed points.
    ctx.fillStyle = '#ffcc88';
    for (let p of dp) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Junctions
  junctions.forEach(j => {
    let isSelected = selectedItems.has(j.id);
    ctx.fillStyle = isSelected ? '#4cacff' : '#ffff00';
    ctx.beginPath();
    ctx.arc(j.x, j.y, isSelected ? 8 : 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
  
  // Components
  components.forEach(comp => {
    let isSelected = selectedItems.has(comp.id);
    let isBlown = comp.type === 'fuse' && (comp.current > comp.rating);
    
    ctx.save();
    ctx.translate(comp.x, comp.y);
    ctx.rotate(comp.rotation * Math.PI / 180);
    
    ctx.strokeStyle = isSelected ? '#4cacff' : (isBlown ? '#ff0000' : '#ffffff');
    ctx.fillStyle = isSelected ? '#4cacff' : (isBlown ? '#ff0000' : '#ffffff');
    ctx.lineWidth = isSelected ? 3 : 2;
    
    ctx.beginPath();
    if (comp.type === 'battery') {
      ctx.moveTo(-40, 0); ctx.lineTo(-8, 0);
      ctx.moveTo(8, 0); ctx.lineTo(40, 0);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(-8, -16); ctx.lineTo(-8, 16);
      ctx.stroke();
      
      ctx.lineWidth = (isSelected ? 5 : 4);
      ctx.beginPath();
      ctx.moveTo(8, -8); ctx.lineTo(8, 8);
      ctx.stroke();
      
      ctx.font = 'bold 14px Segoe UI';
      ctx.fillText('+', -18, -8);
      ctx.fillText('-', 13, -8);
    } 
    else if (comp.type === 'resistor') {
      ctx.moveTo(-40, 0); ctx.lineTo(-24, 0);
      ctx.lineTo(-20, -10); ctx.lineTo(-12, 10); ctx.lineTo(-4, -10);
      ctx.lineTo(4, 10); ctx.lineTo(12, -10); ctx.lineTo(20, 10); ctx.lineTo(24, 0);
      ctx.lineTo(40, 0);
      ctx.stroke();
    } 
    else if (comp.type === 'switch') {
      ctx.moveTo(-40, 0); ctx.lineTo(-15, 0);
      ctx.moveTo(15, 0); ctx.lineTo(40, 0);
      ctx.stroke();
      
      ctx.beginPath(); ctx.arc(-15, 0, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(15, 0, 3, 0, Math.PI * 2); ctx.fill();
      
      ctx.beginPath();
      if (comp.state === 'OFF') {
        ctx.moveTo(-15, 0); ctx.lineTo(10, -16);
      } else {
        ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
      }
      ctx.stroke();
    } 
    else if (comp.type === 'fuse') {
      ctx.moveTo(-40, 0); ctx.lineTo(-20, 0);
      ctx.moveTo(20, 0); ctx.lineTo(40, 0);
      ctx.stroke();
      
      ctx.strokeRect(-20, -10, 40, 20);
      
      ctx.font = '12px Segoe UI';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(comp.rating + 'A', 0, 0);
      
      if (comp.state === 'BLOWN') {
        ctx.beginPath();
        ctx.moveTo(-15, -8); ctx.lineTo(15, 8);
        ctx.moveTo(-15, 8); ctx.lineTo(15, -8);
        ctx.stroke();
      }
    }
    ctx.restore();
    
    // Toggle button in top right of component in world space
    if (comp.type === 'switch' || comp.type === 'fuse') {
      drawToggleButton(comp);
    }
    
    // Label in world space
    ctx.save();
    ctx.font = '12px Segoe UI';
    ctx.fillStyle = isSelected ? '#4cacff' : (isBlown ? '#ff0000' : '#ffffff');
    ctx.textAlign = 'center';
    let label = comp.name;
    if (comp.type === 'battery') label += ` (${comp.voltage}V)`;
    if (comp.type === 'resistor') label += ` (${comp.resistance}Ω)`;
    ctx.fillText(label, comp.x, comp.y - 28);
    ctx.restore();
  });
  
  if (hoverTerminal) {
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(hoverTerminal.x, hoverTerminal.y, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  
  if (selectionBox) {
    ctx.strokeStyle = '#4cacff';
    ctx.fillStyle = 'rgba(76, 172, 255, 0.15)';
    ctx.lineWidth = 1;
    let rx = Math.min(selectionBox.startX, selectionBox.endX);
    let ry = Math.min(selectionBox.startY, selectionBox.endY);
    let rw = Math.abs(selectionBox.endX - selectionBox.startX);
    let rh = Math.abs(selectionBox.endY - selectionBox.startY);
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeRect(rx, ry, rw, rh);
  }
}

function drawToggleButton(comp) {
  let btn = getToggleButtonBox(comp);
  ctx.save();
  ctx.fillStyle = '#222222';
  ctx.strokeStyle = '#666666';
  ctx.lineWidth = 1;
  ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
  ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
  
  ctx.font = '9px Segoe UI';
  ctx.fillStyle = (comp.state === 'ON' || comp.state === 'INTACT') ? '#4ee44e' : '#ff5555';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(comp.state === 'INTACT' ? 'OK' : comp.state, btn.x + btn.w / 2, btn.y + btn.h / 2);
  ctx.restore();
}

// Power a voltage supply is delivering to the circuit (W).
function batterySuppliedPower(b) {
  return (b.voltage || 0) * (b.current || 0);
}

// Minutes (whole number) until a supply drains from current SOC to targetSOC%,
// draining at the present rate. Returns null if not draining / already below.
function minutesUntilSOC(b, targetSOC) {
  let maxWh = b.maxEnergyWh || 0;
  let soc = (b.soc === undefined ? 100 : b.soc);
  let powerW = batterySuppliedPower(b);
  if (maxWh <= 0 || powerW <= 1e-9) return null;
  let deltaSOC = soc - targetSOC;
  if (deltaSOC <= 0) return 0;
  let energyWh = maxWh * (deltaSOC / 100);   // energy above the target threshold
  let hours = energyWh / powerW;
  return Math.floor(hours * 60);
}

function updateSystemSummary() {
  if (!systemSummary) return;
  if (errorMessages.length > 0) {
    systemSummary.style.display = 'none';
    return;
  }

  let supplies = components.filter(c => c.type === 'battery');
  if (supplies.length === 0) {
    systemSummary.style.display = 'none';
    return;
  }

  let totalSupplied = supplies.reduce((s, b) => s + batterySuppliedPower(b), 0);
  let maxVoltage = 0;
  components.forEach(c => {
    let v = (c.type === 'battery') ? (c.voltage || 0) : (c.voltageDrop || 0);
    if (v > maxVoltage) maxVoltage = v;
  });
  let maxCurrent = components.reduce((m, c) => Math.max(m, c.current || 0), 0);

  // Minutes until the first supply reaches 0% SOC.
  let runtimes = supplies.map(b => minutesUntilSOC(b, 0)).filter(v => v !== null);
  let systemMinutes = runtimes.length > 0 ? Math.min(...runtimes) : null;

  systemSummary.style.display = 'block';
  systemSummary.innerHTML = `
    <div class="summary-title">System Summary</div>
    <div class="summary-grid">
      <div class="summary-item">Total Supplied Power: <span class="val">${totalSupplied.toFixed(3)} W</span></div>
      <div class="summary-item">Maximum Voltage: <span class="val">${maxVoltage.toFixed(3)} V</span></div>
      <div class="summary-item">Maximum Current: <span class="val">${maxCurrent.toFixed(3)} A</span></div>
      <div class="summary-item">Runtime to 0% SOC: <span class="val">${systemMinutes === null ? 'N/A' : systemMinutes + ' min'}</span></div>
    </div>`;
}

function updateUI() {
  if (errorMessages.length > 0) {
    errorBanner.style.display = 'block';
    errorBanner.innerHTML = errorMessages.join('<br>');
  } else {
    errorBanner.style.display = 'none';
  }
  updateSystemSummary();
  
  compListContainer.innerHTML = '';
  let allItems = [
    ...components.map(c => ({ id: c.id, name: c.name, type: c.type, sub: c.type === 'battery' ? `${c.voltage}V` : c.type === 'resistor' ? `${c.resistance}Ω` : c.state })),
    ...junctions.map(j => ({ id: j.id, name: j.name, type: 'junction', sub: `(${j.x},${j.y})` })),
    ...wires.map(w => ({ id: w.id, name: w.name, type: 'wire', sub: `${w.current.toFixed(2)}A` }))
  ];
  
  allItems.forEach(item => {
    let div = document.createElement('div');
    div.className = 'comp-list-item' + (selectedItems.has(item.id) ? ' selected' : '');
    div.innerHTML = `<span>${item.name}</span> <span class="type-badge">${item.sub}</span>`;
    div.onclick = () => {
      selectedItems.clear();
      selectedItems.add(item.id);
      render();
      updatePropertiesPanel();
    };
    compListContainer.appendChild(div);
  });
  
  updatePropertiesPanel();
  render();
}

function updatePropertiesPanel() {
  if (selectedItems.size === 0) {
    propContent.innerHTML = `<div class="empty-state">Select a component, wire, or junction on the grid to view its properties and simulation formulas.</div>`;
    return;
  }
  if (selectedItems.size > 1) {
    propContent.innerHTML = `
      <div class="prop-group">
        <label class="prop-label">Multiple Selection</label>
        <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">${selectedItems.size} items selected</div>
        <div class="prop-row">
          <button class="btn" style="flex:1;" onclick="rotateSelected()">🔄 Rotate All</button>
          <button class="btn danger" style="flex:1;" onclick="deleteSelected()">🗑️ Delete All</button>
        </div>
      </div>`;
    return;
  }
  
  let id = Array.from(selectedItems)[0];
  let comp = components.find(c => c.id === id);
  let junc = junctions.find(j => j.id === id);
  let wire = wires.find(w => w.id === id);
  
  if (comp) {
    let f = getFormulas(comp);
    let html = `
      <div class="prop-group">
        <label class="prop-label">Name</label>
        <input type="text" class="prop-input" value="${comp.name}" onchange="updateProp('${comp.id}', 'name', this.value)">

    if (comp.type === 'battery') {
      html += `
        <div class="prop-group">
          <label class="prop-label">Voltage (V)</label>
          <input type="number" class="prop-input" value="${comp.voltage}" step="0.5" onchange="updateProp('${comp.id}', 'voltage', parseFloat(this.value))">
        </div>
        <div class="prop-group">
          <label class="prop-label">Max Available Energy (Wh)</label>
          <input type="number" class="prop-input" value="${comp.maxEnergyWh === undefined ? 100 : comp.maxEnergyWh}" step="10" min="0" onchange="updateProp('${comp.id}', 'maxEnergyWh', Math.max(0, parseFloat(this.value)))">
        </div>
        <div class="prop-group">
          <label class="prop-label">State of Charge (%)</label>
          <input type="number" class="prop-input" value="${comp.soc === undefined ? 100 : comp.soc}" step="1" min="0" max="100" onchange="updateProp('${comp.id}', 'soc', Math.max(0, Math.min(100, parseFloat(this.value))))">
        </div>`;
    } else if (comp.type === 'resistor') {
      html += `
        <div class="prop-group">
          <label class="prop-label">Resistance (Ω)</label>
          <input type="number" class="prop-input" value="${comp.resistance}" step="10" min="0.01" onchange="updateProp('${comp.id}', 'resistance', Math.max(0.01, parseFloat(this.value)))">
        </div>`;
    } else if (comp.type === 'switch') {
      html += `
        <div class="prop-group">
          <label class="prop-label">Switch State</label>
          <select class="prop-input" onchange="updateProp('${comp.id}', 'state', this.value)">
            <option value="ON" ${comp.state === 'ON' ? 'selected' : ''}>ON (Closed)</option>
            <option value="OFF" ${comp.state === 'OFF' ? 'selected' : ''}>OFF (Open)</option>
          </select>
        </div>`;
    } else if (comp.type === 'fuse') {
      html += `
        <div class="prop-group">
          <label class="prop-label">Current Rating (A)</label>
          <input type="number" class="prop-input" value="${comp.rating}" step="0.5" min="0.1" onchange="updateProp('${comp.id}', 'rating', Math.max(0.1, parseFloat(this.value)))">
        </div>
        <div class="prop-group">
          <label class="prop-label">Fuse State</label>
          <select class="prop-input" onchange="updateProp('${comp.id}', 'state', this.value)">
            <option value="INTACT" ${comp.state === 'INTACT' ? 'selected' : ''}>INTACT</option>
            <option value="BLOWN" ${comp.state === 'BLOWN' ? 'selected' : ''}>BLOWN</option>
          </select>
        </div>`;
    }
    
    html += `
      <div class="prop-group">
        <div class="prop-row">
          <button class="btn" style="flex:1;" onclick="rotateSelected()">🔄 Rotate 90°</button>
          <button class="btn danger" style="flex:1;" onclick="deleteSelected()">🗑️ Delete</button>
        </div>
      </div>
      
      <div style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>
      <div class="panel-title">Simulation Analysis</div>
      
      <div class="prop-group">
        <label class="prop-label">Current Flowing</label>
        <div style="font-size: 15px; font-weight: bold; color: #fff;">${(comp.current || 0).toFixed(3)} A</div>
        <div class="formula-box">
          <div>Formula: ${f.current.var}</div>
          <div class="formula-num">= ${f.current.num}</div>
        </div>
      </div>
      
      <div class="prop-group">
        <label class="prop-label">Voltage Drop</label>
        <div style="font-size: 15px; font-weight: bold; color: #fff;">${(comp.voltageDrop || 0).toFixed(3)} V</div>
        <div class="formula-box">
          <div>Formula: ${f.voltage.var}</div>
          <div class="formula-num">= ${f.voltage.num}</div>
        </div>
      </div>`;

    // --- POWER (Feature 1) ---
    let power = comp.power || 0;
    let powerColor = power < 0 ? '#ff6b7a' : '#4ee44e';
    html += `
      <div class="prop-group">
        <label class="prop-label">Power</label>
        <div style="font-size: 15px; font-weight: bold; color: ${powerColor};">${power.toFixed(3)} W</div>
        <div class="formula-box">
          <div>Formula: ${comp.type === 'battery' ? 'Voltage' : 'ΔVoltage'} × I</div>
          <div class="formula-num">= ${(comp.signedVoltage || 0).toFixed(3)}V × ${(comp.current || 0).toFixed(3)}A = ${power.toFixed(3)}W</div>
        </div>
      </div>`;

    // --- OUTPUT POWER AS % OF SUPPLIED (Feature 2) ---
    if ((comp.signedVoltage || 0) < 0) {
      let totalSupplied = components.filter(c => c.type === 'battery')
        .reduce((s, b) => s + (b.voltage || 0) * (b.current || 0), 0);
      let outputPower = Math.abs(power);
      let pct = totalSupplied > 1e-9 ? (outputPower / totalSupplied) * 100 : 0;
      html += `
        <div class="prop-group">
          <label class="prop-label">Output Power (% of Supplied)</label>
          <div style="font-size: 15px; font-weight: bold; color: #a3d9ff;">${pct.toFixed(2)} %</div>

            <div>Formula: |Output Power| / Total Supplied Power × 100</div>

    // --- VOLTAGE SUPPLY ENERGY / RUNTIME (Feature 3) ---
    if (comp.type === 'battery') {
      let maxWh = comp.maxEnergyWh === undefined ? 100 : comp.maxEnergyWh;
      let soc = comp.soc === undefined ? 100 : comp.soc;
      let availableWh = maxWh * (soc / 100);
      let m35 = minutesUntilSOC(comp, 35);
      let m15 = minutesUntilSOC(comp, 15);
      let m0 = minutesUntilSOC(comp, 0);
      let fmt = (m) => (m === null ? 'N/A (not draining)' : m + ' min');
      html += `
        <div style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>

          <div style="font-size: 15px; font-weight: bold; color: #fff;">${availableWh.toFixed(3)} Wh</div>

            <div>Formula: Max Available Energy × SOC</div>

        </div>
        <div class="prop-group">
          <label class="prop-label">Time to Drain at Current Rate</label>
          <div class="branch-list">
            <div class="branch-item"><span>SOC → 35%</span><span>${fmt(m35)}</span></div>
            <div class="branch-item"><span>SOC → 15%</span><span>${fmt(m15)}</span></div>
            <div class="branch-item"><span>SOC → 0%</span><span>${fmt(m0)}</span></div>
          </div>
        </div>`;
    }

    propContent.innerHTML = html;
  } 
  else if (junc) {
    let connectedBranches = getJunctionBranchCurrents(junc);
    
    let branchesHtml = connectedBranches.map((b) => {
      let val = b.current;
      let sign = val >= 0 ? '+' : '';
      return `<div class="branch-item"><span>${b.name}</span><span style="color:${val >= 0 ? '#4ee44e' : '#ff6b7a'}">${sign}${val.toFixed(3)} A</span></div>`;
    }).join('');
    
    let kclFormula = connectedBranches.map((b, idx) => `I_${idx+1}`).join(" + ") + " = 0";
    let kclNum = connectedBranches.map((b) => (b.current >= 0 ? `${b.current.toFixed(2)}A` : `(${b.current.toFixed(2)}A)`)).join(" + ") + " = 0A";
    
    propContent.innerHTML = `
      <div class="prop-group">
        <label class="prop-label">Junction Name</label>
        <input type="text" class="prop-input" value="${junc.name}" onchange="updateProp('${junc.id}', 'name', this.value)">
      </div>
      <div class="prop-group">
        <label class="prop-label">Grid Coordinates</label>
        <div style="font-size: 13px; color: #aaa;">(${junc.x}, ${junc.y})</div>
      </div>
      <div class="prop-group">
        <button class="btn danger" style="width: 100%;" onclick="deleteSelected()">🗑️ Delete Junction</button>
      </div>
      <div style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>
      <div class="panel-title">Kirchhoff's Current Law (KCL)</div>
      <div class="prop-group">
        <label class="prop-label">Connected Branches (${connectedBranches.length})</label>
        <div style="font-size:11px;color:#888;margin-bottom:4px;">Negative currents indicate flow out of junction.</div>
        <div class="branch-list">${branchesHtml || '<div style="padding:4px;color:#666;">No connected wires</div>'}</div>
      </div>
      <div class="prop-group">
        <label class="prop-label">Junction Rule Equation</label>
        <div class="formula-box">
          <div>Formula: ${kclFormula || '0 = 0'}</div>
          <div class="formula-num">= ${kclNum || '0A = 0A'}</div>
        </div>
      </div>`;
  }
  else if (wire) {
    propContent.innerHTML = `
      <div class="prop-group">
        <label class="prop-label">Wire Name</label>
        <input type="text" class="prop-input" value="${wire.name}" onchange="updateProp('${wire.id}', 'name', this.value)">
      </div>
      <div class="prop-group">
        <label class="prop-label">Nodes (${wire.nodes.length})</label>
        <div style="font-size: 13px; color: #aaa;">${wirePoints(wire).map(p => `(${p.x}, ${p.y})`).join(' → ')}</div>
      </div>
      <div class="prop-group">
        <button class="btn danger" style="width: 100%;" onclick="deleteSelected()">🗑️ Delete Wire</button>
      </div>
      <div style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>
      <div class="panel-title">Current Flow</div>
      <div class="prop-group">
        <label class="prop-label">Current</label>
        <div style="font-size: 15px; font-weight: bold; color: #fff;">${(wire.current || 0).toFixed(3)} A</div>
        <div class="formula-box">
          <div>Formula: Branch Current</div>
          <div class="formula-num">= ${(wire.current || 0).toFixed(3)} A</div>
        </div>
      </div>`;
  }
}

function updateProp(id, prop, val) {
  let item = components.find(c => c.id === id) || junctions.find(j => j.id === id) || wires.find(w => w.id === id);
  if (item) {
    item[prop] = val;
    runSimulation();
  }
}

function rotateSelected() {
  // Wires bound to component terminals re-resolve automatically after rotation.
  selectedItems.forEach(id => {
    let comp = components.find(c => c.id === id);
    if (comp) comp.rotation = ((comp.rotation || 0) + 90) % 360;
  });
  runSimulation();
}

function deleteSelected() {
  if (selectedItems.size === 0) return;
  let deletedCompIds = new Set(components.filter(c => selectedItems.has(c.id)).map(c => c.id));
  // Detach any wire nodes bound to soon-to-be-deleted components (freeze them in place).
  wires.forEach(w => {
    w.nodes = w.nodes.map(n => {
      if (n.compId !== undefined && deletedCompIds.has(n.compId)) {
        let p = nodePos(n);
        return { x: p.x, y: p.y };
      }
      return n;
    });
  });
  components = components.filter(c => !selectedItems.has(c.id));
  junctions = junctions.filter(j => !selectedItems.has(j.id));
  wires = wires.filter(w => !selectedItems.has(w.id));
  selectedItems.clear();
  runSimulation();
}

// --- EVENT LISTENERS ---
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    deleteSelected();
  } else if (e.key === 'r' || e.key === 'R') {
    rotateSelected();
  } else if (e.key === 'w' || e.key === 'W') {
    setToolMode('wire');
  } else if (e.key === 's' || e.key === 'S') {
    setToolMode('select');
  }
});

function setToolMode(mode) {
  toolMode = mode;
  document.getElementById('btn-tool-select').className = 'btn' + (mode === 'select' ? ' active' : '');
  document.getElementById('btn-tool-wire').className = 'btn' + (mode === 'wire' ? ' active' : '');
  canvas.style.cursor = mode === 'wire' ? 'crosshair' : 'default';
  if (mode !== 'wire') wireDrawing = null;
  render();
}

// Determine the correct node for a click position, binding to a component
// terminal or a wire terminal if the click lands on one.
function resolveDrawNode(mx, my) {
  if (hoverTerminal) {
    return { compId: hoverTerminal.compId, terminalIndex: hoverTerminal.terminalIndex, _pt: { x: hoverTerminal.x, y: hoverTerminal.y } };
  }
  let sx = snap(mx), sy = snap(my);
  return { x: sx, y: sy, _pt: { x: sx, y: sy } };
}

// Single-click: prime a new point for the wire currently being drawn.
function addWirePoint(mx, my) {
  let node = resolveDrawNode(mx, my);
  let pt = node._pt;
  delete node._pt;

  if (!wireDrawing) {
    wireDrawing = { nodes: [node], currentX: mx, currentY: my, startPt: pt };
    render();
    return;
  }
  wireDrawing.nodes.push(node);
  wireDrawing.currentX = mx;
  wireDrawing.currentY = my;
  render();
}

// Double-click: add a final node and finalize the current wire.
function finishWireDrawing(mx, my) {
  if (!wireDrawing) return;
  let node = resolveDrawNode(mx, my);
  delete node._pt;
  wireDrawing.nodes.push(node);

  let nodes = wireDrawing.nodes;
  wireDrawing = null;

  // Drop consecutive duplicate points.
  let cleaned = [];
  for (let n of nodes) {
    let p = nodePos(n);
    if (cleaned.length > 0) {
      let pp = nodePos(cleaned[cleaned.length - 1]);
      if (pp.x === p.x && pp.y === p.y) continue;
    }
    cleaned.push(n);
  }
  if (cleaned.length < 2) { runSimulation(); return; }

  commitDrawnWire(cleaned);
  if (toolMode !== 'wire') setToolMode('select');
  runSimulation();
}

// Apply extension / branch / junction rules to a freshly drawn polyline.
function commitDrawnWire(nodes) {
  let startPt = nodePos(nodes[0]);
  let endPt = nodePos(nodes[nodes.length - 1]);

  // Check the start endpoint against existing wires.
  let startHit = locateOnWire(startPt.x, startPt.y, 6);
  let endHit = locateOnWire(endPt.x, endPt.y, 6);

  // Extension rule: if an endpoint lands on the terminal of an existing wire,
  // treat the new wire as a continuation of that existing wire.
  if (startHit && startHit.isTerminal && extendExistingWire(startHit.wire, startPt, nodes, true)) {
    return;
  }
  if (endHit && endHit.isTerminal && extendExistingWire(endHit.wire, endPt, nodes, false)) {
    return;
  }

  // Branch rule: if an endpoint lands on a non-terminal part of an existing
  // wire, create a junction there (splitting the target wire's polyline).
  if (startHit && !startHit.isTerminal) {
    splitWireAtInteriorPoint(startHit.wire, startPt.x, startPt.y);
  }
  if (endHit && !endHit.isTerminal) {
    splitWireAtInteriorPoint(endHit.wire, endPt.x, endPt.y);
  }

  addWireFromNodes(nodes);
}

// Merge freshly drawn nodes into an existing wire at the given terminal.
function extendExistingWire(w, joinPt, nodes, joinAtStart) {
  let pts = wirePoints(w);
  let atFirst = (Math.abs(pts[0].x - joinPt.x) < 1 && Math.abs(pts[0].y - joinPt.y) < 1);
  // Order new nodes so the shared point is dropped and the rest continue the wire.
  let extra = joinAtStart ? nodes.slice(1) : nodes.slice(0, -1);
  if (!joinAtStart) extra = extra.slice().reverse();
  if (atFirst) {
    w.nodes = extra.reverse().concat(w.nodes);
  } else {
    w.nodes = w.nodes.concat(extra);
  }
  return true;
}

document.getElementById('btn-tool-select').onclick = () => setToolMode('select');
document.getElementById('btn-tool-wire').onclick = () => setToolMode('wire');
document.getElementById('btn-rotate').onclick = rotateSelected;
document.getElementById('btn-delete').onclick = deleteSelected;
document.getElementById('btn-add-wire').onclick = () => setToolMode('wire');

document.querySelectorAll('.comp-add-btn[data-type]').forEach(btn => {
  btn.onclick = () => {
    let type = btn.getAttribute('data-type');
    let cx = snap(canvasContainer.scrollLeft + canvasContainer.clientWidth / 2);
    let cy = snap(canvasContainer.scrollTop + canvasContainer.clientHeight / 2);
    let comp = addComponent(type, cx, cy);
    selectedItems.clear();
    selectedItems.add(comp.id);
    runSimulation();
  };
  
  btn.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', btn.getAttribute('data-type'));
  });
});

canvasContainer.addEventListener('dragover', (e) => e.preventDefault());
canvasContainer.addEventListener('drop', (e) => {
  e.preventDefault();
  let type = e.dataTransfer.getData('text/plain');
  if (type) {
    let rect = canvas.getBoundingClientRect();
    let x = snap(e.clientX - rect.left);
    let y = snap(e.clientY - rect.top);
    let comp = addComponent(type, x, y);
    selectedItems.clear();
    selectedItems.add(comp.id);
    runSimulation();
  }
});

canvas.addEventListener('mousemove', (e) => {
  let rect = canvas.getBoundingClientRect();
  let mx = e.clientX - rect.left;
  let my = e.clientY - rect.top;
  
  hoverTerminal = null;
  for (let c of components) {
    let terms = getTerminals(c);
    terms.forEach((t, idx) => {
      if (Math.hypot(mx - t.x, my - t.y) <= 15) {
        hoverTerminal = { x: t.x, y: t.y, compId: c.id, terminalIndex: idx };
      }
    });
  }
  
  if (wireDrawing) {
    wireDrawing.currentX = mx;
    wireDrawing.currentY = my;
    render();
    return;
  }
  
  if (isDragging && dragTarget) {
    let newX = snap(mx - dragOffset.x);
    let newY = snap(my - dragOffset.y);

    if (dragTarget.kind === 'component') {
      // Wires bound to this component's terminals auto-follow via nodePos().
      dragTarget.item.x = newX;
      dragTarget.item.y = newY;
      runSimulation();
    } else if (dragTarget.kind === 'junction') {
      let j = dragTarget.item;
      let ox = j.x, oy = j.y;
      if (newX !== ox || newY !== oy) {
        // Move any free wire nodes that sit on this junction.
        wires.forEach(w => {
          w.nodes.forEach(n => {
            if (!isBoundNode(n) && n.x === ox && n.y === oy) { n.x = newX; n.y = newY; }
          });
        });
        j.x = newX; j.y = newY;
        runSimulation();
      }
    } else if (dragTarget.kind === 'wireNode') {
      let n = dragTarget.item.nodes[dragTarget.nodeIndex];
      if (!isBoundNode(n)) {
        let ox = n.x, oy = n.y;
        n.x = newX; n.y = newY;
        junctions.forEach(j => { if (j.x === ox && j.y === oy) { j.x = newX; j.y = newY; } });
        runSimulation();
      }
    } else if (dragTarget.kind === 'wireMidpoint') {
      let dx = newX - dragOffset.lastX;
      let dy = newY - dragOffset.lastY;
      if (dx !== 0 || dy !== 0) {
        let w = dragTarget.item;
        let i = dragTarget.segIndex;
        [w.nodes[i], w.nodes[i + 1]].forEach(n => {
          if (!isBoundNode(n)) { n.x = snap(n.x + dx); n.y = snap(n.y + dy); }
        });
        dragOffset.lastX = newX;
        dragOffset.lastY = newY;
        runSimulation();
      }
    }
    return;
  }
  
  if (selectionBox) {
    selectionBox.endX = mx;
    selectionBox.endY = my;
    render();
    return;
  }
  
  render();
});

canvas.addEventListener('mousedown', (e) => {
  let rect = canvas.getBoundingClientRect();
  let mx = e.clientX - rect.left;
  let my = e.clientY - rect.top;
  
  // Wire drawing: single click primes/adds a point; handled via addWirePoint().
  // (Double-click to terminate is handled in the dblclick listener.)
  if (toolMode === 'wire' || wireDrawing || (toolMode === 'select' && hoverTerminal && !isDragging)) {
    addWirePoint(mx, my);
    return;
  }
  
  let found = findItemAt(mx, my);
  if (found) {
    if (found.type === 'toggle') {
      let c = found.comp;
      if (c.type === 'switch') c.state = (c.state === 'ON') ? 'OFF' : 'ON';
      if (c.type === 'fuse') c.state = (c.state === 'INTACT') ? 'BLOWN' : 'INTACT';
      runSimulation();
      return;
    }
    
    if (!e.shiftKey && !selectedItems.has(found.item.id)) {
      selectedItems.clear();
    }
    selectedItems.add(found.item.id);
    updatePropertiesPanel();
    render();
    
    if (found.type === 'component') {
      isDragging = true;
      dragTarget = { kind: 'component', item: found.item };
      dragOffset = { x: mx - found.item.x, y: my - found.item.y };
    } else if (found.type === 'junction') {
      isDragging = true;
      dragTarget = { kind: 'junction', item: found.item };
      dragOffset = { x: mx - found.item.x, y: my - found.item.y };
    } else if (found.type === 'wireNode') {
      let p = nodePos(found.item.nodes[found.nodeIndex]);
      isDragging = true;
      dragTarget = { kind: 'wireNode', item: found.item, nodeIndex: found.nodeIndex };
      dragOffset = { x: mx - p.x, y: my - p.y };
    } else if (found.type === 'wireMidpoint') {
      isDragging = true;
      dragTarget = { kind: 'wireMidpoint', item: found.item, segIndex: found.segIndex };
      dragOffset = { x: 0, y: 0, lastX: snap(mx), lastY: snap(my) };
    }
    return;
  }
  
  if (!e.shiftKey) {
    selectedItems.clear();
    updatePropertiesPanel();
  }
  selectionBox = { startX: mx, startY: my, endX: mx, endY: my };
  render();
});

canvas.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    dragTarget = null;
    runSimulation();
  }
  
  if (selectionBox) {
    let rx1 = Math.min(selectionBox.startX, selectionBox.endX);
    let rx2 = Math.max(selectionBox.startX, selectionBox.endX);
    let ry1 = Math.min(selectionBox.startY, selectionBox.endY);
    let ry2 = Math.max(selectionBox.startY, selectionBox.endY);
    
    if (rx2 - rx1 > 5 && ry2 - ry1 > 5) {
      components.forEach(c => {
        if (c.x >= rx1 && c.x <= rx2 && c.y >= ry1 && c.y <= ry2) selectedItems.add(c.id);
      });
      junctions.forEach(j => {
        if (j.x >= rx1 && j.x <= rx2 && j.y >= ry1 && j.y <= ry2) selectedItems.add(j.id);
      });
      wires.forEach(w => {
        let pts = wirePoints(w);
        if (pts.every(p => p.x >= rx1 && p.x <= rx2 && p.y >= ry1 && p.y <= ry2)) {
          selectedItems.add(w.id);
        }
      });
      updatePropertiesPanel();
    }
    selectionBox = null;
    render();
  }
});

canvas.addEventListener('dblclick', (e) => {
  if (toolMode !== 'wire' && !wireDrawing) return;
  let rect = canvas.getBoundingClientRect();
  let mx = e.clientX - rect.left;
  let my = e.clientY - rect.top;
  // The dblclick fires after two mousedowns which each primed a point;
  // remove the duplicate point that the second click added.
  if (wireDrawing && wireDrawing.nodes.length > 1) {
    wireDrawing.nodes.pop();
  }
  finishWireDrawing(mx, my);
});

initSampleCircuit();
</script>
